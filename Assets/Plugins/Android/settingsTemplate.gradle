pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher'
include ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        // Patched: build the repo URL from a File so Gradle percent-encodes the
        // spaces in the project path ("git repositories", "My Repo"). The stock
        // EDM4U line emits a raw file:/// string and Gradle 8/9 throws
        // "Cannot convert URI ... to a file". Re-apply this if a Force Resolve
        // overwrites it (or move the project to a path with no spaces).
        def unityProjectPath = $/**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url new File(unityProjectPath, "Assets/GeneratedLocalRepo/Firebase/m2repository") // Assets/Firebase/Editor/AppDependencies.xml:25, Assets/Firebase/Editor/AuthDependencies.xml:23, Assets/Firebase/Editor/FirestoreDependencies.xml:23
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
